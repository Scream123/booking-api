services:

  nginx:
    image: nginx:latest
    ports:
      - "8876:80"
    volumes:
      - ./:/var/www
      - ./_docker/nginx/conf.d/:/etc/nginx/conf.d/
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: _docker/app/Dockerfile
    volumes:
      - ./:/var/www
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: secret
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  queue-worker:
    build:
      context: .
      dockerfile: _docker/app/Dockerfile
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: php artisan queue:work
    restart: always
    depends_on:
      - app
      - db
      - redis

volumes:
  mysql_data:
  redis_data: